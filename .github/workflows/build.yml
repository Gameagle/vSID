name: Build

on:
  # push currently not needed and disabled
  #push:
      #branches:
        #- v0.8.x # needs to be the same as vars.DEV_BRANCH

  pull_request:
    types: [closed]
    branches:
      - main
      - stable

  workflow_dispatch:

jobs:
  zoneinfo:
    uses: ./.github/workflows/zoneinfo.yml

  build:
    needs: zoneinfo
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Get dll version
      id: dllversion
      shell: bash
      run: |
        version=$(grep -Eo 'const std::string pluginVersion = "[^"]+"' vSIDPlugin.h | cut -d'"' -f2)
        echo "Version is: $version"
        echo "version=$version" >> $GITHUB_OUTPUT
        
    - name: Determine prerelease of current build
      id: prerelease
      shell: bash
      run: |
        if [[ ${{github.ref}} != "refs/heads/stable" ]]; then
          echo "Prerelease is true"
          echo "prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "Prerelease is not true"
          echo "prerelease=false" >> $GITHUB_OUTPUT
        fi
        echo "github.ref is ${{ github.ref }}"
        
    - name: Append commit sha to version
      if: ${{ steps.prerelease.outputs.prerelease == 'true' }}
      id: commitversion
      shell: bash
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        SHA_VERSION="${{steps.dllversion.outputs.version}}-$SHORT_SHA"
        echo "shaversion=$SHA_VERSION" >> $GITHUB_OUTPUT
        echo "Versions. version = ${{steps.dllversion.outputs.version}}, short_sha = $SHORT_SHA, new_version = $SHA_VERSION"
        sed -i 's/const std::string pluginVersion = ".*";/const std::string pluginVersion = "'$SHA_VERSION'";/' vSIDPlugin.h      
      
    - name: Determine release name
      id: releasename
      shell: bash
      run: |
        if [[ "${{ steps.prerelease.outputs.prerelease }}" == 'true' ]]; then
          echo "Setting pre-release name"
          echo "releasename=v${{ steps.commitversion.outputs.shaversion }}" >> $GITHUB_OUTPUT
        else
          echo "Setting stable name"
          echo "releasename=v${{steps.dllversion.outputs.version}}" >> $GITHUB_OUTPUT
        fi

    - name: Show clang-cl shipped with Visual Studio
      # no LLVM installation: the Visual Studio of the runner image provides clang-cl (used via -T ClangCL)
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
        $vsPath = & $vswhere -latest -products * -property installationPath
        # The runner is x64. Use the x64 (or legacy x86 "bin") host tool, never ARM64.
        $clang = $null
        foreach ($sub in "x64\bin", "bin") {
          $candidate = Join-Path $vsPath "VC\Tools\Llvm\$sub\clang-cl.exe"
          if (Test-Path $candidate) { $clang = Get-Item $candidate; break }
        }
        if (-not $clang) {
          Write-Host "Available clang-cl binaries:"
          Get-ChildItem -Path (Join-Path $vsPath "VC\Tools\Llvm") -Filter clang-cl.exe -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
          Write-Error "No x64 clang-cl found in Visual Studio at $vsPath (component 'C++ Clang tools for Windows' missing?)"
          exit 1
        }
        Write-Host "Using $($clang.FullName)"
        & $clang.FullName --version
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: Download and unpack libcurl
      shell: pwsh
      run: |
        $curlVersion = "8.17.0"
        $curlTag = "curl-" + ($curlVersion -replace '\.', '_')
        $url = "https://github.com/curl/curl/archive/refs/tags/$curlTag.zip"

        Write-Host "Downloading libcurl $curlVersion from $url"

        New-Item -ItemType Directory -Force -Path external | Out-Null

        $zipPath = "external/curl.zip"
        Invoke-WebRequest -Uri $url -OutFile $zipPath

        # verify SHA256 for integrity
        # ps command: Get-FileHash .\filename.zip -Algorithm SHA256
        $expectedHash = "0BE15247C07422A0061FDA4758C0182BB9C688E40ECF968D1A0B92742A32667E"
        $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
        if ($hash -ne $expectedHash.ToLower()) {
          Write-Error "Hash mismatch for libcurl archive. Expected $expectedHash but got $hash"
          exit 1
        }

        Expand-Archive -Path $zipPath -DestinationPath "external" -Force

        $repoName = "curl"
        
        $unpackedDir = Join-Path "external" "$repoName-$curlTag"   # → external/curl-curl-8_17_0
        
        if (Test-Path "external/curl") {
          Remove-Item -Recurse -Force "external/curl"
        }
        
        Rename-Item -Path $unpackedDir -NewName "curl"

    - name: Configure CMake
      # remove --trace for less verbosity
      run: cmake -B build -S . -T ClangCL -A Win32 -DCMAKE_BUILD_TYPE=Release --trace
      
    - name: Build DLL
      # remove --verbose for less verbosity
      run: cmake --build build --config Release --verbose

    - name: Rename PDB and MAP files
      shell: pwsh
      run: |
        $releaseName = "${{ steps.releasename.outputs.releasename }}"
        Write-Host "Appending $releaseName to .pdb and .map files..."
        
        $files = Get-ChildItem -Path "build\Release" -Include *.pdb, *.map -Recurse
        foreach ($file in $files) {
            $newName = "{0}-{1}{2}" -f $file.BaseName, $releaseName, $file.Extension
            Rename-Item -Path $file.FullName -NewName $newName -PassThru
        }
        
    - name: Create PDB and MAP artifact
      uses: actions/upload-artifact@v7
      with:
        name: vSID-PDB_MAP
        path: |
          build\Release\*.pdb
          build\Release\*.map
        if-no-files-found: error
        retention-days: 14

    - name: Create first zip file (vSID.dll and config.json)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path output
        Compress-Archive -Path build\Release\vSID.dll, vSIDConfig.json, RNAV_List.json, ICAO_Aircraft.json -DestinationPath output/files.zip

    - name: Create second zip file (config folder)
      shell: pwsh
      run: |
        Compress-Archive -Path config -DestinationPath output/config.zip

    - name: Download zoneinfo artifact
      uses: actions/download-artifact@v7
      with:
        name: zoneinfo
        path: output
          
    - name: Extract and Compare Versions
      id: changelog_version
      shell: bash
      run: |
          # Extract version from Changelog
          version=$(grep -Eo '\[Changelog v[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?\]' Changelog.txt | head -n 1 | sed -E 's/\[Changelog v([0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?)\]/\1/')
          
          # Compare with current app version
          if [[ "$version" == "${{steps.dllversion.outputs.version}}" ]]; then
            echo "Versions match!"
            echo "match=true" >> $GITHUB_OUTPUT
            echo "version=$version" >> $GITHUB_OUTPUT
          else
            echo "Versions do not match."
            echo "match=false" >> $GITHUB_OUTPUT
          fi
          echo "DLL Version - '${{steps.dllversion.outputs.version}}' and log version - '$version'"
          
    - name: Extract Release Body
      if: ${{ steps.changelog_version.outputs.match == 'true' }}
      id: release_body
      shell: bash
      run: |
          # Extract version and release body
          version="${{ steps.changelog_version.outputs.version }}"
          releaseBody=$(awk -v version="$version" '
            $0 ~ "\\[Changelog v" version "\\]" { 
              found=1
              next 
            } 
            found && /^\[Changelog v/ { 
              exit 
            } 
            found { 
              print 
            }' Changelog.txt)
        
          echo "Release Body:"
          echo "$releaseBody"
        
          # Save release body to a file
          echo "$releaseBody" > release_body.txt

    - name: Delete old pre-releases
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
          latest_release=$(gh release list --limit 1 --json tagName,isPrerelease --jq '.[0]')

          if [ -z "$latest_release" ]; then
            echo "No releases found."
          else
            echo "Release found."

            gh release list --json tagName,isPrerelease --jq '.[] | {tagName: .tagName, isPrerelease: .isPrerelease}' > releases.json
            cat releases.json | while read -r release; do
              echo "Checking $release"
              if echo "$release" | jq -e 'has("tagName") and has("isPrerelease")' > /dev/null; then
                TAG=$(echo "$release" | jq -r '.tagName')
                RELEASE_PRERELEASE=$(echo "$release" | jq -r '.isPrerelease')
                echo "RELEASE_PRERELEASE is ${RELEASE_PRERELEASE}"
                if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
                  VERSION_RELEASE_PRERELEASE=$(echo "$TAG" | sed -e 's/^v//')
                    if [[ "${{steps.prerelease.outputs.prerelease}}" == "true" && "$VERSION_RELEASE_PRERELEASE" == *"${{steps.dllversion.outputs.version}}"* ]]; then
                      echo "Deleting pre-release with same version $TAG"
                      gh release delete "${TAG}" -y
                    elif [[ "${{steps.prerelease.outputs.prerelease}}" == "false" && "$RELEASE_PRERELEASE" == "true" ]]; then
                      echo "Deleting pre-release $TAG on new stable release"
                      gh release delete "$TAG" -y
                    fi
                fi
              else
                echo "Skipping invalid release entry: $release"
              fi
            done
          fi

    - name: Remove old tags
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tags=$(gh api repos/${GITHUB_REPOSITORY}/tags --jq '.[].name')
        
        for tag in $tags; do
          # if tag is in format vX.Y.Z.W-abcd but not in format vX.Y.Z.W remove (pre-release tags)
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?-.*$ ]]; then
            echo "Deleting tag: $tag"
            git push origin :refs/tags/$tag
          fi
        done

    - name: Create GitHub Release and Upload Assets
      id: create_release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.releasename.outputs.releasename }}
        body_path: release_body.txt
        name: ${{ steps.releasename.outputs.releasename }}
        target_commitish: ${{ github.sha }}
        draft: false
        prerelease: ${{steps.prerelease.outputs.prerelease}}
        files: |
          output/files.zip
          output/config.zip
          output/zoneinfo.zip